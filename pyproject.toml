[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["I", "F", "B", "UP", "SIM", "C4", "RUF", "ASYNC", "FURB", "E", "W"]
preview = true
ignore = [
    "RUF067",
]

[tool.ruff.lint.isort]
# Preserve the isort settings previously used with black.
combine-as-imports = true
force-sort-within-sections = true
order-by-type = true
